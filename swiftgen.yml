strings:
    inputs:
      - Healthy/Resources/Localization/Localizable.strings
    outputs:
      - templateName: structured-swift5
        output: Generated/Localizable.swift

xcassets:
  - inputs:
      - Healthy/Resources/Assets.xcassets
    outputs:
      - templateName: swift5
        output: Generated/Assets.swift

  - inputs:
      - Healthy/Resources/Colors.xcassets
    outputs:
      - templateName: swift5
        output: Generated/Colors.swift
